name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build .\src\PdvBarcodeFilter\PdvBarcodeFilter.csproj -c Release

      - name: Build scanner simulator
        run: dotnet build .\tools\PdvQrScannerSimulator\PdvQrScannerSimulator.csproj -c Release

      - name: Run tests
        run: dotnet run --project .\tests\PdvBarcodeFilter.Tests\PdvBarcodeFilter.Tests.csproj -c Release
